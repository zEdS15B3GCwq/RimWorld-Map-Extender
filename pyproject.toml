[project]
name = "rwmapext"
version = "0.1.0"
description = "A command-line tool that makes an existing RimWorld map bigger by rewriting the save file offline."
readme = "README.md"
authors = [
    { name = "Tamas Fehervari", email = "58502181+zEdS15B3GCwq@users.noreply.github.com" }
]
requires-python = ">=3.15"
dependencies = [
    "lxml>=6.1.3",
    "numpy>=2.5.4",
    "pillow>=13.0.0",
]

[project.scripts]
rwmapext = "rwmapext:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"
